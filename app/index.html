    <!-- Excalidraw content fonts (Excalifont and kin) load via `new URL(path, base)`,
         where base is normalizeBaseUrl(EXCALIDRAW_ASSET_PATH). A RELATIVE base is
         resolved against location.origin, which under file:// is the drive root
         (or "null"), so the local font 404s and Excalidraw silently falls back to
         its esm.sh CDN, breaking the offline guarantee the moment any text is on a
         board. An ABSOLUTE base (computed from the document URL, correct in both the
         file:// build and the http dev server) keeps every font local. -->
    <script>window.EXCALIDRAW_ASSET_PATH = new URL('./excalidraw-assets/', document.baseURI).href;</script>
